<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица ПВД</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background: #f1f9ff;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>

    <h1>📋 Таблица ПВД</h1>
    <div id="table-container">
        <div class="loading">⏳ Загрузка данных...</div>
    </div>

    <script>
        // ССЫЛКА НА ОПУБЛИКОВАННЫЙ CSV
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMnI3Qm6LkqLcmvIKPH0cGGNBTqt73axEhqZyHS9-vYuUxmCx_66vUXzut4Cv2SpZn3-lNiljG5o1I/pub?gid=1950806852&single=true&output=csv';

        async function loadTable() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Парсим CSV в массив строк
                const rows = csvText.split('\n').filter(row => row.trim() !== '');
                const headers = rows[0].split(',').map(h => h.trim());
                const data = rows.slice(1).map(row => row.split(',').map(cell => cell.trim()));

                // Строим HTML-таблицу
                let html = '<table>';
                html += '<thead><tr>';
                headers.forEach(h => {
                    html += `<th>${h}</th>`;
                });
                html += '</tr></thead><tbody>';

                data.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => {
                        html += `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table>';
                document.getElementById('table-container').innerHTML = html;

            } catch (error) {
                document.getElementById('table-container').innerHTML = 
                    `<p style="color:red;text-align:center;">❌ Ошибка загрузки: ${error.message}</p>`;
            }
        }

        loadTable();
    </script>

</body>
</html>
